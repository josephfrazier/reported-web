name: Auto-fix lint and update snapshots

on:
  pull_request:

jobs:
  fix-and-update-snapshots:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Use Node.js 24.12.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0

      - run: curl -o- -L https://yarnpkg.com/install.sh | bash -s -- --version 1.22.19
      - run: echo "$HOME/.yarn/bin" >> "$GITHUB_PATH"
      - run: yarn

      - name: Run yarn fix
        run: yarn fix

      - name: Commit and push lint fixes
        id: lint-fixes
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          if git diff --exit-code --quiet; then
            echo "No lint fixes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "$(git log -1 --format='%an')"
            git config user.email "$(git log -1 --format='%ae')"
            git add -A
            git commit -m '[bot] Apply `yarn fix` lint auto-fixes'
            git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/${{ github.repository }}.git"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update test snapshots
        if: steps.lint-fixes.outputs.pushed != 'true'
        run: yarn test:no-flaky -u

      - name: Commit and push snapshot updates
        if: steps.lint-fixes.outputs.pushed != 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          if git diff --exit-code --quiet; then
            echo "No snapshot updates to commit"
          else
            git config user.name "$(git log -1 --format='%an')"
            git config user.email "$(git log -1 --format='%ae')"
            git add -A
            git commit -m '[bot] Update test snapshots with `yarn test:no-flaky -u`'
            git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/${{ github.repository }}.git"
            git push
          fi
