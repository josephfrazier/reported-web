name: Node.js CI - test (flaky, allowed to fail)

on: [push]

jobs:
  test-flaky:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.22.1]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: curl -o- -L https://yarnpkg.com/install.sh | bash -s -- --version 1.22.19
    - run: export PATH=$HOME/.yarn/bin:$PATH
    - run: yarn
    - shell: bash
      env:
        # A comma-separated list. Until a PLATERECOGNIZER_TOKENS secret exists,
        # build it from the two secrets this workflow used before.
        PLATERECOGNIZER_TOKENS: ${{ secrets.PLATERECOGNIZER_TOKENS || format('{0},{1}', secrets.PLATERECOGNIZER_TOKEN, secrets.PLATERECOGNIZER_TOKEN_TWO) }}
      run: yarn test:flaky
