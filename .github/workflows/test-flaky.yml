name: Node.js CI - test (flaky, allowed to fail)

on: [push]

jobs:
  test-flaky:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.22.1]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ matrix.node-version }}
    # This job calls LookupAPlate through `wreq-js`, which uses the system
    # store. The runner image can predate the Ubuntu CA update, so install the
    # patched package before the test.
    - name: Install the patched CA certificates
      run: |
        sudo apt-get update
        sudo apt-get install -y --only-upgrade ca-certificates
    - run: corepack enable
    - run: corepack prepare yarn@1.22.22 --activate
    - run: yarn
    - shell: bash
      env:
        PLATERECOGNIZER_TOKEN_LIST: ${{ secrets.PLATERECOGNIZER_TOKEN_LIST }}
      run: yarn test:flaky
