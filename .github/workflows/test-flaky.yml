name: Node.js CI - test (flaky, allowed to fail)

on: [push]

jobs:
  test-flaky:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.22.1]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - run: corepack enable
    - run: corepack prepare yarn@1.22.22 --activate
    - run: yarn
    - shell: bash
      env:
        PLATERECOGNIZER_TOKEN_LIST: ${{ secrets.PLATERECOGNIZER_TOKEN_LIST }}
      run: yarn test:flaky
