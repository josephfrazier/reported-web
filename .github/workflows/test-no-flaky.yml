name: Node.js CI - test (except flaky ones)

on: [push]

jobs:
  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.22.1]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ matrix.node-version }}
    # The mongod 4.4 binary that mongodb-memory-server downloads for the
    # getSubmissions test needs libssl1.1, which the runner's Ubuntu doesn't ship.
    - name: Install libssl1.1
      run: |
        wget -q https://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
        # SHA-256 from the Ubuntu focal Packages index.
        echo "09ee28588a1fb5613ddc6c26a992d5a76931b3cf22c022930da413a5e580599e  libssl1.1_1.1.1f-1ubuntu2_amd64.deb" | sha256sum -c -
        sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
    - run: curl -o- -L https://yarnpkg.com/install.sh | bash -s -- --version 1.22.19
    - run: export PATH=$HOME/.yarn/bin:$PATH
    - run: yarn
    - shell: bash
      env:
        GEO_APP_ID: ${{ secrets.GEO_APP_ID }}
        GEO_APP_KEY: ${{ secrets.GEO_APP_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      run: yarn test:no-flaky
